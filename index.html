<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بازارپل | خرید عمده مطمئن</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:tahoma,Arial,sans-serif;
background:#f4f7f6;
color:#222;
text-align:center;
}

header{
background:#08734f;
color:white;
padding:30px 15px;
}

header h1{
margin:0 0 10px;
font-size:32px;
}

header p{
margin:0;
font-size:17px;
}

.container{
max-width:600px;
margin:25px auto;
padding:0 15px;
}

.box{
background:white;
padding:25px 20px;
margin:20px 0;
border-radius:16px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
margin-top:0;
font-size:21px;
}

button{
display:inline-block;
padding:14px 24px;
margin:8px;
border:0;
border-radius:10px;
background:#08734f;
color:white;
font-family:tahoma;
font-size:16px;
cursor:pointer;
}

input{
display:block;
width:90%;
max-width:380px;
margin:15px auto;
padding:14px;
border:1px solid #ccc;
border-radius:10px;
font-family:tahoma;
font-size:16px;
text-align:center;
}

#result{
margin-top:15px;
font-weight:bold;
min-height:25px;
}

footer{
margin-top:30px;
padding:20px;
color:#666;
font-size:13px;
}
</style>
</head>

<body>

<header>
<h1>بازارپل</h1>
<p>بازار عمده‌فروشی مطمئن</p>
</header>

<div class="container">

<div class="box">
<h2>🛒 ثبت درخواست خرید</h2>
<p>برای خرید عمده، درخواست خود را ثبت کنید.</p>

<button onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLSfcJ7aexpq3EK0NBRxxPmI1r298iZQtOtdxnavxFcofptcdDQ/viewform','_blank')">
ثبت درخواست خرید
</button>
</div>

<div class="box">
<h2>🏪 ثبت تأمین‌کننده</h2>
<p>اگر تأمین‌کننده هستید، اطلاعات خود را ثبت کنید.</p>

<button onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLSdkkL9kjiIJZCst9okj_0X6ajCOF7r2swPXjb1h5EKrCLgD-Q/viewform','_blank')">
ثبت تأمین‌کننده
</button>
</div>

<div class="box">
<h2>📦 پیگیری درخواست</h2>

<p>کد پیگیری خود را وارد کنید:</p>

<input id="code" type="text" inputmode="numeric" placeholder="مثلاً 1001">

<button onclick="checkCode()">پیگیری درخواست</button>

<div id="result"></div>
</div>

</div>

<footer>
بازارپل؛ پل ارتباطی خریداران عمده و تأمین‌کنندگان
</footer>

<script>

async function checkCode(){

const code=document.getElementById("code").value.trim();
const result=document.getElementById("result");

if(code===""){
result.innerHTML="⚠️ لطفاً کد پیگیری را وارد کنید";
return;
}

result.innerHTML="⏳ در حال بررسی...";

try{

const response=await fetch("tracking.json?x="+Date.now());

if(!response.ok){
throw new Error("خطا");
}

const trackingData=await response.json();

if(trackingData[code]){
result.innerHTML="✅ وضعیت درخواست: "+trackingData[code];
}else{
result.innerHTML="❌ کد پیگیری پیدا نشد";
}

}catch(error){

result.innerHTML="⚠️ خطا در دریافت اطلاعات پیگیری";

}

}

</script>

</body>
</html>
